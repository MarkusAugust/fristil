<!doctype html>
<!--
  The share card: what X, Mastodon, Slack and the others show when someone
  shares a link to the documentation. `share-card.ts` renders it to
  `public/og.png` at exactly 1200 × 630, and it is the front page in
  miniature, not an advert for it: the same sheet, the same mark and the three
  categories, in the dark theme, because that is how a card stands in a feed
  that is mostly dark.

  The colours are read from the package's own tokens, so the card follows the
  system, apart from the mark, whose colours are fixed. The version is not on
  the card: a committed image would show the wrong number from the first
  release after it was drawn.
-->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Mono:wght@400;500&display=block"
    />
    <link rel="stylesheet" href="../../interfaces/src/tokens/tokens.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--lt-color-neutral-canvas);
        color: var(--lt-color-neutral-text);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }

      /* The same grain as the front page, inverted for the dark surface. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: url("../public/grain.webp") repeat;
        background-size: 384px 384px;
        filter: invert(1);
        mix-blend-mode: screen;
        opacity: 0.14;
      }

      .card {
        position: relative;
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100%;
        box-sizing: border-box;
        padding: 64px 72px 56px;
      }

      .label {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--lt-color-accent-text);
      }

      .middle {
        align-self: center;
        display: flex;
        align-items: center;
        gap: 28px;
      }

      .mark {
        flex: none;
        width: 150px;
        height: 150px;
      }

      .name {
        margin: 0;
        font-family: "Michroma", sans-serif;
        font-weight: 400;
        font-synthesis: none;
        font-size: 104px;
        line-height: 0.9;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--lt-color-neutral-text-strong);
      }

      /* As in Logo.astro: the T pulled in until its bar hangs over the hyphen. */
      .join {
        margin-inline-end: -0.3em;
        color: var(--lt-color-accent-fill);
      }

      .line {
        margin: 22px 0 0;
        font-size: 26px;
        color: var(--lt-color-neutral-text);
      }

      /* The register rule from the masthead: an accent mark at the front of a grey rule. */
      .register {
        height: 4px;
        margin-bottom: 28px;
        background: linear-gradient(
          to right,
          var(--lt-color-accent-fill) 0 96px,
          var(--lt-color-neutral-border-strong) 96px
        );
      }

      .nodes {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 24px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .nodes li {
        display: flex;
        align-items: baseline;
        gap: 12px;
        font-family: "Michroma", sans-serif;
        font-size: 21px;
        text-transform: uppercase;
        color: var(--lt-color-neutral-text-strong);
      }

      .nodes small {
        font-family: "IBM Plex Mono", monospace;
        font-size: 16px;
        letter-spacing: 0.1em;
        color: var(--lt-color-neutral-text-subtle);
      }

      .nodes .address {
        font-family: "IBM Plex Mono", monospace;
        font-size: 20px;
        text-transform: none;
        color: var(--lt-color-accent-text);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="label">Søbernetics &middot; Node 02</p>
      <div class="middle">
        <svg class="mark" viewBox="-5 -12.0711 125.071 129.071" xmlns="http://www.w3.org/2000/svg">
          <path fill="#111212" d="M7 105L7 117L49.07 117L70 96.07L70 82L70 65L70 35L92.07 35L120.07 7L96.07 7L108.07 -5L23 -5L23 -12.07L-5 15.93L-5 105Z" />
          <path fill="#4992e2" d="M49 110L12 110L12 112L47 112ZM54 105L37.07 105L12 105L12 108L51 108ZM59 100L42.07 100L39.07 103L56 103ZM64 95L47.07 95L44.07 98L61 98ZM65 90L52.07 90L49.07 93L65 93ZM65 85L57.07 85L54.07 88L65 88ZM65 80L62.07 80L59.07 83L65 83ZM95 25L58 25L58 28L92 28ZM100 20L83.07 20L80.07 23L97 23ZM105 15L88.07 15L85.07 18L102 18ZM108 12L91.07 12L90.07 13L107 13ZM58 33L65 33L65 30L58 30ZM58 38L65 38L65 35L58 35ZM58 43L65 43L65 40L58 40ZM58 48L65 48L65 45L58 45ZM58 53L65 53L65 50L58 50ZM58 58L65 58L65 55L58 55ZM58 63L65 63L65 60L58 60ZM58 68L65 68L65 65L58 65ZM58 73L65 73L65 70L58 70ZM58 77L65 77L65 75L58 75ZM30 25L23 25L23 28L30 28ZM23 33L30 33L30 30L23 30ZM23 38L30 38L30 35L23 35ZM23 43L30 43L30 40L23 40ZM23 48L30 48L30 45L23 45ZM23 53L30 53L30 50L23 50ZM23 58L30 58L30 55L23 55ZM23 63L30 63L30 60L23 60ZM23 68L30 68L30 65L23 65ZM23 73L30 73L30 70L23 70ZM23 77L30 77L30 75L23 75Z" />
          <path fill="#e6e8eb" d="M23 18L35 18L35 77L53 77L53 18L78 18L96 0L23 0ZM0 100L35 100L53 82L18 82L18 0L0 18Z" />
        </svg>
        <div>
          <h1 class="name">LO<span class="join">-</span>TEK</h1>
          <p class="line">Interfaces. CSS classes and web components.</p>
        </div>
      </div>
      <div>
        <div class="register"></div>
        <ul class="nodes">
          <li><small>01</small>css</li>
          <li><small>02</small>frame</li>
          <li><small>03</small>standalone</li>
          <li class="address">lo-tek.sobernetics.no</li>
        </ul>
      </div>
    </div>
  </body>
</html>
