name: Publish the extension

# Runs when a tag of the form extension-v* is pushed, and can be started by
# hand. The extension has its own number, separate from the package's v*
# tags. Until 0.9.0 the tags were called utvidelse-v*.
on:
  push:
    tags: ["extension-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Read the version
        id: version
        working-directory: editor
        run: echo "number=$(bun -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check that the tag and the version agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#extension-v}"
          if [ "$tag" != "${{ steps.version.outputs.number }}" ]; then
            echo "The tag $GITHUB_REF_NAME says $tag, while editor/package.json says ${{ steps.version.outputs.number }}. Fix it before publishing." >&2
            exit 1
          fi

      # The generator reads the component classes from dist, so the package
      # has to be built first. `bun run typecheck` does that with the
      # repository's own tsc, and type checks the extension at the same time.
      - name: Build the package
        run: bun run typecheck

      # The extension carries the core in dist/, built from Rust. rustup
      # fetches the version in `core/rust-toolchain.toml`.
      - name: Build the core
        run: bun --filter @lo-tek/interfaces core

      # Checks that the vocabulary and the editor files in the package are
      # what the generator would write now, and that the diagnostics fail what
      # they should, before the extension is packed with them.
      - name: Check the vocabulary and the diagnostics
        run: |
          (cd designsystem && bun run build:browser)
          bun --filter @lo-tek/interfaces check:vocabulary
          bun core/scripts/check-diagnostics.ts

      - name: Pack
        run: bun --filter interfaces check

      # Marketplace has no OIDC. The token is created under the publisher on
      # marketplace.visualstudio.com and stored as the secret VSCE_PAT.
      - name: Publish
        working-directory: editor
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: ./node_modules/.bin/vsce publish --packagePath lotek.vsix
