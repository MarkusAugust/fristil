[package]
name = "lotek-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LO-TEK's check and theme generator, compiled to WebAssembly for every host language."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# The command line, `lotek`, is a separate crate in `../cli/`: an adapter that
# uses the core as an ordinary library.
#
# One dependency: the CSS tokenizer from Servo, the one Firefox uses, which reads
# CSS following CSS Syntax Level 3. The theme check needs it, and the stylesheet
# reader is to be built on the same one. The manifest is read by a small JSON
# reader in `src/json.rs`, and the regular expressions from TypeScript are
# written out by hand, so the module needs no regex engine.
[dependencies]
cssparser = "0.38"
