org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# One module, so nothing to parallelise.
org.gradle.caching=true
kotlin.code.style=official

# The IDE has its own Kotlin standard library. If the plugin bundles its own,
# the two collide at runtime.
kotlin.stdlib.default.dependency=false

pluginVersion=0.4.0

# The platform the plugin compiles against, and the oldest IDE it promises to
# work in. They must be the same build: `sinceBuild=251` against `2026.1`
# would promise 2025.1 without anything checking the promise.
platformVersion=2026.1
sinceBuild=261
