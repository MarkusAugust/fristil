name: Publish the IntelliJ plugin

# Runs when a tag of the form intellij-v* is pushed, and can be started by
# hand. The plugin has its own number in editor-intellij/gradle.properties,
# separate from the package's v* tags and the extension's extension-v* tags.
#
# JetBrains approves every version before it becomes visible on Marketplace,
# so a run here only uploads. The first version was uploaded by hand, as
# Marketplace requires.
on:
  push:
    tags: ["intellij-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, test and upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin package is built from the npm package. The plugin uses it
      # from `../kotlin`, which is newer than what is on npm between two
      # releases, so the tarball is packed here from the commit, with Bun and
      # Rust.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # rustup is on the machine and fetches the version in
      # `core/rust-toolchain.toml`.
      - name: Rust version
        working-directory: core
        run: rustc --version

      - name: Pack the npm package
        run: bun --filter @lo-tek/interfaces pack

      - name: Read the version
        id: version
        working-directory: editor-intellij
        run: |
          number=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          platform=$(grep '^platformVersion=' gradle.properties | cut -d= -f2)
          if [ -z "$number" ] || [ -z "$platform" ]; then
            echo "Found no pluginVersion and platformVersion in gradle.properties" >&2
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "platform=$platform" >> "$GITHUB_OUTPUT"

      - name: Check that the tag and the version agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#intellij-v}"
          if [ "$tag" != "${{ steps.version.outputs.number }}" ]; then
            echo "The tag $GITHUB_REF_NAME says $tag, while gradle.properties says ${{ steps.version.outputs.number }}. Fix it before publishing." >&2
            exit 1
          fi

      - name: Restore the IntelliJ platform from cache
        uses: actions/cache@v4
        with:
          path: editor-intellij/.intellijPlatform
          key: intellij-${{ steps.version.outputs.platform }}

      - name: Build and test
        working-directory: editor-intellij
        run: ./gradlew build -Plotek.package=../interfaces

      # Marketplace has no OIDC. The token is created under the profile on
      # plugins.jetbrains.com (My Tokens) and stored as the secret
      # JETBRAINS_MARKETPLACE_TOKEN. If it is missing, the step stops here
      # rather than with a Gradle error about a property that is not set.
      - name: Upload to JetBrains Marketplace
        working-directory: editor-intellij
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_intellijPlatformPublishingToken" ]; then
            echo "The secret JETBRAINS_MARKETPLACE_TOKEN is missing." >&2
            exit 1
          fi
          ./gradlew publishPlugin -Plotek.package=../interfaces
