name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lar en gren kjøres før det finnes en PR, så feil i selve arbeidsflyten
  # kommer fram med en gang.
  workflow_dispatch:

# En ny push til samme gren avbryter forrige kjøring. Det er ingen vits i å
# kjøre tre nettlesere gjennom en versjon ingen skal se igjen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sjekk:
    name: Lint, typer og tester
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Arbeidsflyten som publiserer kjører alltid nyeste npm, og `npm pack`
      # er en del av byggesjekkene. Møter ikke CI samme npm, viser en endring
      # i npm seg først når en versjon skal ut.
      - name: Oppdater npm
        run: npm install --global npm@latest

      - name: Installer avhengigheter
        run: bun install --frozen-lockfile

      # Nettleserne er store, og endrer seg bare når Playwright gjør det.
      - name: Hent nettlesere fra hurtigbufferen
        id: nettlesere
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Pakkens egen Playwright, ikke `bunx playwright`, som kan hente en
      # annen versjon enn den vitest bruker.
      - name: Installer nettlesere
        working-directory: designsystem
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: bun run lint

      - name: Typesjekk
        run: bun run typecheck

      - name: Typesjekk av testene
        run: bun run typecheck:tests

      # Kjører komponenttestene i Chromium, Firefox og WebKit, og kontrollerer
      # at Tailwind-temaet gir Fristils verdier.
      - name: Tester
        run: bun run test

      # Pakken har kjernen med seg, bygget fra Rust. `rust-toolchain.toml` i
      # `kjerne/` bestemmer versjonen, og rustup henter den ved første kall.
      - name: Rust-versjon
        working-directory: kjerne
        run: rustc --version

      # Bygger pakken og dokumentasjonen, og kontrollerer at pakken inneholder
      # det den lover.
      - name: Bygg
        run: bun run build

      # Kommandolinja skrevet i Rust skal svare det samme som den i pakken,
      # byte for byte, på hver kjøring i sjekk-cli.ts.
      - name: Kommandolinja i Rust svarer som den i pakken
        run: |
          cargo build --release -p fristil --manifest-path kjerne/Cargo.toml
          FRISTIL_SAMMENLIGN="$PWD/kjerne/target/release/fristil" bun designsystem/scripts/sjekk-cli.ts

      # Siden slik Chromium har rendret den, med stilarkene den lastet.
      - name: Den rendrede siden
        working-directory: designsystem
        run: bun scripts/sjekk-rendret.ts

      # Språkserveren over ekte standard inn og ut, i hver vert: Node, den
      # kjørbare fila og VS Code-utvidelsens server. Jar-en prøves under.
      - name: Språkserveren
        run: |
          bun designsystem/scripts/sjekk-lsp.ts
          FRISTIL_CLI="$PWD/kjerne/target/release/fristil" bun designsystem/scripts/sjekk-lsp.ts
          (cd editor && bun run build)
          FRISTIL_CLI="[\"node\",\"$PWD/editor/dist/server.js\"]" bun designsystem/scripts/sjekk-lsp.ts

      # VS Code er 300 MB, og hentes bare når versjonen i engines endres.
      - name: Hent VS Code fra hurtigbufferen
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('editor/package.json') }}

      # Utvidelsen i en ekte VS Code, med språkserveren koblet til.
      - name: VS Code-utvidelsen
        run: xvfb-run -a bun editor/scripts/sjekk-vscode.ts

      # Java 17, den laveste versjonen jar-en lover å virke på.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Og det samme for `java -jar fristil.jar`, som kjører WASI-modulen med
      # Chicory.
      - name: Kommandolinja på JVM-en svarer som den i pakken
        run: |
          (cd kotlin && ./gradlew :kommandolinje:samletJar)
          FRISTIL_SAMMENLIGN="[\"java\",\"-jar\",\"$PWD/kotlin/kommandolinje/build/libs/fristil.jar\"]" bun designsystem/scripts/sjekk-cli.ts
          FRISTIL_CLI="[\"java\",\"-jar\",\"$PWD/kotlin/kommandolinje/build/libs/fristil.jar\"]" bun designsystem/scripts/sjekk-lsp.ts

      # De genererte filene skal være de generatoren ville skrevet nå.
      #
      # `build` kjører `generate` som første steg, så vaktpostene sammenligner
      # alltid med det som nettopp ble skrevet, og en utdatert fil på disk kan
      # ikke felle dem. Her spørres git i stedet: står det noe å commite etter
      # bygget, er en generert fil merget uten å være regenerert, og filene på
      # GitHub er det agenter og npm-lesere faktisk får.
      - name: Ingenting er ugenerert
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Bygget endret sporede filer. Kjør bun run build og commit:"
            git status --porcelain
            git diff
            exit 1
          fi

      # Kjører axe mot hver bygde side i begge temaer, og kontrollerer at
      # dokumentasjonen følger koden.
      - name: Dokumentasjon
        run: bun run test:docs

  # Rust-kjernen og Kotlin-pakken, ved siden av hovedjobben.
  #
  # Uten filter på stier, i motsetning til IntelliJ-pluginen: kjernen leser
  # manifestet, og en endring i en komponent skal kunne felle den selv om
  # ingen rørte Rust-koden. En jobb som alltid kjører, kan også gjøres
  # påkrevd uten å bli stående og vente.
  kjerne:
    name: Rust-kjernen og Kotlin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Installer avhengigheter
        run: bun install --frozen-lockfile

      # `rust-toolchain.toml` i `kjerne/` bestemmer versjonen. rustup finnes
      # på maskinen og henter den ved første kall.
      - name: Rust-versjon
        working-directory: kjerne
        run: rustc --version

      # Kjernen bygges for nettleseren og vertene (wasm32-unknown-unknown),
      # kommandolinja for maskinen og som WASI-modul (wasm32-wasip1).
      - name: Formatering og lint i Rust
        working-directory: kjerne
        run: |
          cargo fmt --all --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release -p fristil --tests -- -D warnings

      - name: Enhetstester i Rust
        working-directory: kjerne
        run: cargo test --workspace

      - name: Kommandolinja som WASI-modul
        working-directory: kjerne
        run: cargo build --release -p fristil --target wasm32-wasip1

      - name: Bygg kjernen
        run: bun kjerne/scripts/bygg.ts

      # Fiksturene, malene og temaene mot fasiten, og markupen i repoet og
      # 4000 ødelagte sider mot kravene et svar må holde.
      - name: Kjernen svarer det den skal
        run: bun kjerne/scripts/sjekk-kjerne.ts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Kotlin
        working-directory: kotlin
        run: ./gradlew test
