<!-- Thymeleaf. Skrivefeilen med vilje er lt-buton på avbryt-knappen. -->
<form th:action="@{/soknad}" th:object="${soknad}" method="post" novalidate>
  <lt-error-summary th:if="${#fields.hasErrors('*')}" class="lt-error-summary" role="alert" tabindex="-1">
    <h2 class="lt-error-summary__title">Du må rette dette</h2>
    <ul>
      <li th:each="feil : ${#fields.detailedErrors()}"><a th:href="'#' + ${feil.fieldName}" th:text="${feil.message}">Feil</a></li>
    </ul>
  </lt-error-summary>
  <lt-field th:attr="invalid=${#fields.hasErrors('epost')} ? '' : null">
    <label class="lt-label" data-required="text">E-postadresse</label>
    <input class="lt-input" type="email" th:field="*{epost}" th:classappend="${#fields.hasErrors('epost')} ? 'feil'">
    <p class="lt-help-text">Vi sender kvittering hit.</p>
    <p class="lt-error-text" th:errors="*{epost}">Skriv en gyldig adresse.</p>
  </lt-field>
  <button class="lt-button" type="submit" th:text="#{soknad.send}">Send</button>
  <button class="lt-buton" data-variant="secondary" type="button">Avbryt</button>
</form>
