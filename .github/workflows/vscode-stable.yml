name: VS Code stable

# The extension in the newest VS Code, once a week. CI runs it in the lowest
# version the extension promises, `engines.vscode`, on every push. The
# snippets rely on undocumented behaviour, a `.code-snippets` file
# contributed without a `language` (see `vscode/scripts/build-snippets.ts`),
# which a new VS Code could change without a word; this is where that shows,
# rather than with the users. It is not a required check, and a red run says
# VS Code changed, not that a pull request broke something.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# It only builds and tests.
permissions:
  contents: read

# A manual run during the scheduled one waits rather than downloading VS Code
# a second time in parallel.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  vscode-stable:
    name: VS Code stable
    runs-on: ubuntu-latest
    # A VS Code that hangs under xvfb would otherwise run for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Only what the extension needs, and no guards: a red guard here would
      # muddy what a red run means. The extension's build bundles from the
      # package's source and needs no `interfaces/dist`, checked from an empty
      # one; what it needs is the core, the WebAssembly it ships, from Rust in
      # the version `rust-toolchain.toml` at the root of the repository decides.
      # The runner image's rustup fetches the toolchain and the WebAssembly
      # targets from `rust-toolchain.toml`. A step of its own, so a red run
      # here says Rust and not VS Code.
      - name: Rust version
        working-directory: core
        run: rustc --version

      - name: Build the core
        run: bun --filter @lo-tek/interfaces core

      - name: Build the extension
        working-directory: vscode
        run: bun run build

      - name: VS Code extension in stable
        env:
          LOTEK_VSCODE: stable
        run: xvfb-run -a bun vscode/scripts/check-vscode.ts
