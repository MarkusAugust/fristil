# Presentasjonen på designsystemarkitektur.sobernetics.no, som er domenet til
# Netlify-prosjektet designsystemarkitetktur.
#
# Det er et eget Netlify-prosjekt, med denne mappa som basemappe, og det
# bygger fra master på hver push, som dokumentasjonen. Ingenting kompileres:
# bygget kopierer flyturen til index.html så adressen er rota. Lysbildene
# ligger ved siden av som designsystemarkitektur.html, og flyturen henter
# teksten sin derfra. Kopien lages under bygget og er ikke sporet i git.
[build]
  base = "presentasjon"
  publish = "."
  command = "cp flytur.html index.html"
