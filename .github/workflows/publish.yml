name: Publish

# Runs when a version tag is pushed, and can also be started by hand.
#
# A tag gives npm and the CLI on GitHub Releases. The CLI is built from the
# npm package that was just published, and therefore waits for it.
#
# The Kotlin package goes to Maven Central only when the workflow is started
# by hand on the tag with the `maven` option on:
#
#   gh workflow run publish.yml --ref v0.34.0 -f maven=true
#
# Central has a monthly limit on the number of releases and files for a free
# organisation, and every run there counts, however little has changed. npm
# has no such limit, and is the main channel. The Maven version can therefore
# skip npm versions: every Maven version is built from the npm package with
# the same number, so 0.34.3 on Central is the same LO-TEK as 0.34.3 on npm,
# even when 0.34.1 and 0.34.2 never went there.
#
# Started by hand without the option, it publishes the version in
# package.json to npm if it is not out. The CLI is then built from the npm
# package, but not released, and the Maven job does not run.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      maven:
        description: Publish the Kotlin package to Maven Central (only on a tag)
        type: boolean
        default: false

# `id-token` is the whole point: GitHub creates a short-lived OIDC token that
# npm trusts, so there is no secret in the repository. npm also signs an
# attestation that shows which commit the package was built from.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so the step "Check that the tag is on master"
          # can ask whether the commit is an ancestor of master.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The checks that only read package.json and git come first, so a tag
      # set wrongly is rejected before the build, not several minutes after.
      - name: Read the version
        id: version
        working-directory: designsystem
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The tag and the version in package.json must say the same. A tag
      # v0.3.0 on a commit that still says 0.2.0 would otherwise have
      # published 0.2.0, or skipped it, and the tag in the history would point
      # at something other than what is on npm.
      - name: Check that the tag and the version agree
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "${{ steps.version.outputs.number }}" ]; then
            echo "The tag $GITHUB_REF_NAME says $tag, while package.json says ${{ steps.version.outputs.number }}. Fix it before publishing." >&2
            exit 1
          fi

      # The tag must be on master. `bun run tag` refuses otherwise, but a tag
      # set with `git tag` on the commit in the release branch already has the
      # new number, so the check above lets it through, and npm would get a
      # version from a commit that is not merged yet, and may never be merged
      # as it is. CONTRIBUTING.md promises that a tag set too early stops
      # here.
      - name: Check that the tag is on master
        if: github.ref_type == 'tag'
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "The tag $GITHUB_REF_NAME is on $(git rev-parse --short HEAD), which is not on master. Merge the branch first, remove the tag and set it again from master." >&2
            exit 1
          fi

      # npm must be 11.5.1 or newer to get credentials from the OIDC token.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Builds only the package. The documentation has nothing to do with the
      # release, and the build itself checks that the package contains what
      # `exports` promises, that the CLI works, and that the version is in the
      # changelog. The package carries the core, built from Rust in the same
      # job it is published from. rustup fetches the version in
      # `core/rust-toolchain.toml`.
      - name: Rust version
        working-directory: core
        run: rustc --version

      - name: Build the package
        run: bun --filter @lo-tek/interfaces build

      # The first release is made from the machine, since npm only lets you
      # connect a publisher to a package that already exists. The tag for that
      # version would otherwise start a run that failed because the version
      # is taken.
      - name: Check whether the version is already out
        id: registry
        run: |
          if npm view "@lo-tek/interfaces@${{ steps.version.outputs.number }}" version > /dev/null 2>&1; then
            echo "published=yes" >> "$GITHUB_OUTPUT"
          else
            echo "published=no" >> "$GITHUB_OUTPUT"
          fi

      # `--ignore-scripts` because the build was already done in its own step.
      # Without it, `prepublishOnly` runs the whole build again.
      - name: Publish
        if: steps.registry.outputs.published == 'no'
        working-directory: designsystem
        run: npm publish --ignore-scripts

      - name: The version was already published
        if: steps.registry.outputs.published == 'yes'
        run: echo "@lo-tek/interfaces@${{ steps.version.outputs.number }} is already on npm. Nothing was published."

  # The CLI without Node: `lotek.wasm` for wasmtime and other WASI hosts, and
  # `lotek.jar` for `java -jar`. Both come from the npm package for the
  # version, so they are the same files `npx @lo-tek/interfaces` runs.
  #
  # Neither file is signed with a certificate, and nobody has to trust a third
  # party. GitHub instead attests which commit and which workflow each file
  # was built from, and whoever downloads it can check that themselves:
  #
  #   gh attestation verify lotek.jar --repo MarkusAugust/lo-tek
  cli:
    name: The CLI on GitHub Releases
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The registry can take a while before a new version answers everywhere.
      - name: Wait until the version answers on npm
        run: |
          version="$(grep '^version=' kotlin/gradle.properties | cut -d= -f2)"
          for _ in $(seq 1 30); do
            npm view "@lo-tek/interfaces@$version" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@lo-tek/interfaces@$version did not answer on npm within five minutes." >&2
          exit 1

      # Without `lotek.package` Gradle fetches the tarball from npm and
      # compares it with the integrity the registry states.
      - name: The CLI as a jar
        working-directory: kotlin
        run: ./gradlew :cli:fatJar

      - name: Collect the files
        run: |
          mkdir release
          cp kotlin/build/lotek-package/core/lotek.wasm release/
          cp kotlin/cli/build/libs/lotek.jar release/
          (cd release && sha256sum lotek.wasm lotek.jar > SHA256SUMS)
          cat release/SHA256SUMS

      # The files must answer before they are released.
      - name: The files work
        run: |
          java -jar release/lotek.jar --help > /dev/null
          echo '<button class="lt-button">Save</button>' | java -jar release/lotek.jar check

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            release/lotek.wasm
            release/lotek.jar

      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: release/

      # The release is created the first time, and the files are replaced if
      # it already exists, so a new run for the same tag does not fail.
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md in designsystem/."
          fi
          gh release upload "$GITHUB_REF_NAME" release/lotek.wasm release/lotek.jar release/SHA256SUMS --clobber

  # The Kotlin package, the kotlinx.html extension, the CLI and the Gradle
  # plugin, all as `io.github.markusaugust:…` with the same version as the
  # npm package.
  #
  # Only when the workflow is started by hand with `maven` on, see the top.
  # A tag alone never starts this job. The steps that test and publish also
  # require the run to be on a tag, since Gradle builds from the npm tarball
  # for the version and the tests read the expected results from the same
  # commit; started on a branch with the option on, the job runs and stops
  # without publishing.
  #
  # It requires an account on central.sonatype.com with the namespace
  # `io.github.markusaugust` verified, a user token from there and a GPG key
  # uploaded to a key server. The secrets are called `MAVEN_CENTRAL_USERNAME`,
  # `MAVEN_CENTRAL_PASSWORD`, `MAVEN_SIGNING_KEY` (the private key,
  # ASCII-armoured) and `MAVEN_SIGNING_PASSWORD`. If they are missing, the job
  # says so and publishes nothing.
  maven:
    name: Maven Central
    if: github.event_name == 'workflow_dispatch' && inputs.maven
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Read the version
        id: version
        run: echo "number=$(grep '^version=' kotlin/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Wait until the version answers on npm
        run: |
          for _ in $(seq 1 30); do
            npm view "@lo-tek/interfaces@${{ steps.version.outputs.number }}" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@lo-tek/interfaces@${{ steps.version.outputs.number }} did not answer on npm within five minutes." >&2
          exit 1

      # A version on Central can never be replaced, so a new run for the same
      # tag must not try again.
      # A secret that does not exist arrives here as an empty string.
      - name: Check whether the version is already out
        id: central
        env:
          USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          v="${{ steps.version.outputs.number }}"
          if curl -sfI "https://repo1.maven.org/maven2/io/github/markusaugust/lo-tek-interfaces/$v/lo-tek-interfaces-$v.pom" > /dev/null; then
            echo "io.github.markusaugust:lo-tek-interfaces:$v is already on Maven Central. Nothing was published."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          elif [ -z "$USERNAME" ] || [ -z "$PASSWORD" ] || [ -z "$KEY" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::One or more of the secrets for Maven Central are missing, so the Kotlin package was not published. See the comment above the job in publish.yml."
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      # The tests run against the published tarball, so what goes out is
      # tested against exactly those files. Only for a tag: started by hand
      # between two releases, the tarball on npm is older than the expected
      # results in the repository.
      - name: Test
        if: github.ref_type == 'tag'
        working-directory: kotlin
        run: ./gradlew test

      - name: Publish
        if: steps.central.outputs.publish == 'yes' && github.ref_type == 'tag'
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral
