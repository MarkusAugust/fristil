#
# The IntelliJ plugin is built on its own, not in the main sequence.
#
# `bun run check` runs before every push, and reads the steps in ci.yml. A
# Gradle build downloads a whole IDE to compile against, around a gigabyte,
# and would make that promise impossible to keep. Hence a separate workflow
# with `paths`, which only runs when the plugin or the data it reads has
# actually changed.
#
# The classes are read from the project's manifest, with the manifest in
# `../kotlin` as the fallback, and the diagnostics come from the Rust core
# through the same package, which is built with the plugin. That is why
# `core/**`, `kotlin/**` and the manifest are in `paths` too: if someone
# changes the class list, the plugin is built again even when nobody touched
# the Kotlin code.
#
name: IntelliJ plugin

on:
  push:
    branches: [master]
    paths:
      - "editor-intellij/**"
      - "kotlin/**"
      - "core/**"
      - "interfaces/manifest/**"
      - "interfaces/src/**"
      - "interfaces/agent/**"
      - "interfaces/scripts/**"
      - "interfaces/package.json"
      - ".github/workflows/ci-intellij.yml"
  pull_request:
    paths:
      - "editor-intellij/**"
      - "kotlin/**"
      - "core/**"
      - "interfaces/manifest/**"
      - "interfaces/src/**"
      - "interfaces/agent/**"
      - "interfaces/scripts/**"
      - "interfaces/package.json"
      - ".github/workflows/ci-intellij.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin package is built from the npm package. The plugin uses it
      # from `../kotlin`, which is newer than what is on npm, so the tarball
      # is packed here from this commit, with Bun and Rust.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `rust-toolchain.toml` in `core/` decides the version. rustup is on the
      # machine and fetches it on the first call.
      - name: Rust version
        working-directory: core
        run: rustc --version

      - name: Pack the npm package
        run: bun --filter @lo-tek/interfaces pack

      # The platform is a whole IDE of around a gigabyte, and it only changes
      # when `platformVersion` does. The key therefore reads that one line,
      # not all of `gradle.properties`: `pluginVersion` is in the same file,
      # and a version bump would otherwise throw away the cache and download
      # the IDE again for no reason.
      - name: Read the platform version
        id: platform
        working-directory: editor-intellij
        run: |
          version=$(grep '^platformVersion=' gradle.properties | cut -d= -f2)
          if [ -z "$version" ]; then
            echo "Found no platformVersion in gradle.properties"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore the IntelliJ platform from cache
        uses: actions/cache@v4
        with:
          path: editor-intellij/.intellijPlatform
          key: intellij-${{ steps.platform.outputs.version }}

      - name: Build and test
        working-directory: editor-intellij
        run: ./gradlew build -Plotek.package=../interfaces

      - name: Upload the plugin
        uses: actions/upload-artifact@v4
        with:
          name: lo-tek-intellij
          path: editor-intellij/build/distributions/*.zip
