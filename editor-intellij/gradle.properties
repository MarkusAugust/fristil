org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Ett modul, så ingenting å parallellisere.
org.gradle.caching=true
kotlin.code.style=official

# IDE-en har sitt eget Kotlin-standardbibliotek. Pakker pluginen sitt eget,
# kolliderer de to ved kjøring.
kotlin.stdlib.default.dependency=false

pluginVersion=0.1.0

# Plattformen pluginen kompileres mot, og den eldste IDE-en den lover å virke
# i. De skal være samme bygg: `sinceBuild=251` mot `2026.1` ville lovet
# 2025.1 uten at noe etterprøver løftet.
platformVersion=2026.1
sinceBuild=261
