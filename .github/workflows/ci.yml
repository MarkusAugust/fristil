name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets a branch run before there is a PR, so mistakes in the workflow
  # itself show up straight away.
  workflow_dispatch:

# A new push to the same branch cancels the previous run. There is no point in
# running three browsers over a version nobody will look at again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No commit may have a coding agent as its author. See CONTRIBUTING.md.
  authors:
    name: Authors
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, not just the last commit.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: No agent as author
        run: bun designsystem/scripts/check-authors.ts

  check:
    name: Lint, types and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # The publishing workflow always runs the latest npm, and `npm pack` is
      # part of the build checks. If CI does not use the same npm, a change in
      # npm only shows up when a version is being released.
      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The browsers are large, and only change when Playwright does.
      - name: Restore browsers from cache
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # The package's own Playwright, not `bunx playwright`, which can fetch a
      # different version from the one vitest uses.
      - name: Install browsers
        working-directory: designsystem
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Type check the tests
        run: bun run typecheck:tests

      # Runs the component tests in Chromium, Firefox and WebKit, and checks
      # that the Tailwind theme gives LO-TEK's values.
      - name: Tests
        run: bun run test

      # The package carries the core, built from Rust. `rust-toolchain.toml` in
      # `core/` decides the version, and rustup fetches it on the first call.
      - name: Rust version
        working-directory: core
        run: rustc --version

      # Builds the package and the documentation, and checks that the package
      # contains what it promises.
      - name: Build
        run: bun run build

      # The CLI written in Rust must answer the same as the one in the
      # package, byte for byte, on every run in check-cli.ts.
      - name: The Rust CLI answers like the package
        run: |
          cargo build --release -p lotek --manifest-path core/Cargo.toml
          LOTEK_COMPARE="$PWD/core/target/release/lotek" bun designsystem/scripts/check-cli.ts

      # The page as Chromium rendered it, with the stylesheets it loaded.
      - name: The rendered page
        working-directory: designsystem
        run: bun scripts/check-rendered.ts

      # The language server over real standard input and output, in every
      # host: Node, the executable and the VS Code extension's server. The jar
      # is tested below.
      - name: Language server
        run: |
          bun designsystem/scripts/check-lsp.ts
          LOTEK_CLI="$PWD/core/target/release/lotek" bun designsystem/scripts/check-lsp.ts
          (cd editor && bun run build)
          LOTEK_CLI="[\"node\",\"$PWD/editor/dist/server.js\"]" bun designsystem/scripts/check-lsp.ts

      # VS Code is 300 MB, and is only fetched when the version in engines
      # changes.
      - name: Restore VS Code from cache
        uses: actions/cache@v6
        with:
          path: .vscode-test
          key: vscode-${{ runner.os }}-${{ hashFiles('editor/package.json') }}

      # The extension in a real VS Code, with the language server connected.
      - name: VS Code extension
        run: xvfb-run -a bun editor/scripts/check-vscode.ts

      # Java 17, the lowest version the jar promises to run on.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # And the same for `java -jar lotek.jar`, which runs the WASI module with
      # Chicory. The jar is built from the npm package, packed here from this
      # commit, since the code is newer than what is on npm.
      - name: The CLI on the JVM answers like the package
        run: |
          (cd designsystem && npm pack --ignore-scripts --silent)
          (cd kotlin && ./gradlew :cli:fatJar -Plotek.package=../designsystem)
          LOTEK_COMPARE="[\"java\",\"-jar\",\"$PWD/kotlin/cli/build/libs/lotek.jar\"]" bun designsystem/scripts/check-cli.ts
          LOTEK_CLI="[\"java\",\"-jar\",\"$PWD/kotlin/cli/build/libs/lotek.jar\"]" bun designsystem/scripts/check-lsp.ts

      # The generated files must be what the generator would write now.
      #
      # `build` runs `generate` before any check reads the files, so the
      # guards always compare against what was just written, and an outdated
      # file on disk cannot fail them. Here git is asked instead: if there is
      # something to commit after the build, a generated file was merged
      # without being regenerated, and the files on GitHub are what agents
      # and npm readers actually get.
      - name: Generated files are up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The build changed tracked files. Run bun run build and commit:"
            git status --porcelain
            git diff
            exit 1
          fi

      # Runs axe against every built page in both themes, and checks that the
      # documentation follows the code.
      - name: Documentation
        run: bun run test:docs

  # The CLI and the language server on Windows, where paths, drives and
  # processes behave differently. The host opens every drive for the WASI
  # module, and a mistake there broke both npx and the VS Code extension
  # without Linux noticing.
  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rust version
        working-directory: core
        run: rustc --version

      # The core and the CLI as a WASI module, and the package compiled to
      # dist/, which npx runs.
      - name: Build the core and the package
        run: |
          (cd designsystem && bun run core)
          (cd designsystem && bun run build:browser)
          (cd editor && bun run build)

      - name: The CLI through npx
        run: bun designsystem/scripts/check-cli.ts

      # The Windows executable must answer the same, byte for byte.
      - name: The executable answers like npx
        run: |
          cargo build --release -p lotek --manifest-path core/Cargo.toml
          LOTEK_COMPARE="$(pwd -W)/core/target/release/lotek.exe" bun designsystem/scripts/check-cli.ts

      - name: Language server
        run: |
          bun designsystem/scripts/check-lsp.ts
          LOTEK_CLI="[\"node\",\"$(pwd -W)/editor/dist/server.js\"]" bun designsystem/scripts/check-lsp.ts

  # The Rust core and the Kotlin package, next to the main job.
  #
  # No path filter, unlike the IntelliJ plugin: the core reads the manifest,
  # and a change in a component should be able to fail it even when nobody
  # touched the Rust code. A job that always runs can also be made required
  # without being left waiting.
  core:
    name: Rust core and Kotlin
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `rust-toolchain.toml` in `core/` decides the version. rustup is on the
      # machine and fetches it on the first call.
      - name: Rust version
        working-directory: core
        run: rustc --version

      # The core is built for the browser and the hosts
      # (wasm32-unknown-unknown), the CLI for the machine and as a WASI module
      # (wasm32-wasip1).
      - name: Rust formatting and lint
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --release --target wasm32-unknown-unknown -- -D warnings
          cargo clippy --release -p lotek --tests -- -D warnings

      - name: Rust unit tests
        working-directory: core
        run: cargo test --workspace

      - name: The CLI as a WASI module
        working-directory: core
        run: cargo build --release -p lotek --target wasm32-wasip1

      - name: Build the core
        run: bun core/scripts/build.ts

      # The fixtures, the templates and the themes against the expected
      # results, and the markup in the repository and 4000 broken pages
      # against the requirements an answer must meet.
      - name: The core answers as it should
        run: bun core/scripts/check-core.ts

      # Every rule fails what it should, and only that, with the vocabulary
      # from the metadata and the snippets from the component pages as clean
      # cases.
      - name: The diagnostics fail what they should
        run: bun core/scripts/check-diagnostics.ts

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin package is built from the npm package and needs neither
      # Rust nor Bun. The tarball is packed here anyway, from this commit,
      # since the code is newer than what is on npm.
      - name: Pack the npm package
        run: bun --filter @lo-tek/interfaces pack

      - name: Kotlin
        working-directory: kotlin
        run: ./gradlew test -Plotek.package=../designsystem
