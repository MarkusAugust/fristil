name: Publiser

# Kjører når en versjonstagg dyttes opp, og kan også startes for hånd.
#
# npm først, så kommandolinja på GitHub Releases og Kotlin-pakken på Maven
# Central. De to siste bygges av npm-pakken som nettopp ble publisert, og
# venter derfor på den.
#
# Startet for hånd publiserer den versjonen i package.json til npm hvis den
# ikke er ute. Kommandolinja og Kotlin-pakken bygges da, men gis ikke ut:
# det skjer bare for en tagg.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# `id-token` er hele poenget: GitHub lager et kortlevd OIDC-bevis som npm
# stoler på, så det ligger ingen hemmelighet i repoet. npm signerer samtidig
# en attestasjon som viser hvilken commit pakken ble bygd fra.
permissions:
  id-token: write
  contents: read

jobs:
  publiser:
    name: npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm må være 11.5.1 eller nyere for å kunne hente legitimasjon fra
      # OIDC-beviset.
      - name: Oppdater npm
        run: npm install --global npm@latest

      - name: Installer avhengigheter
        run: bun install --frozen-lockfile

      # Bygger bare pakken. Dokumentasjonen har ingenting med utgivelsen å
      # gjøre, og bygget kontrollerer selv at pakken inneholder det `exports`
      # lover, at kommandolinja virker, og at versjonen står i loggen.
      # Pakken har kjernen med seg, bygget fra Rust i samme jobb som den
      # publiseres fra. rustup henter versjonen i `kjerne/rust-toolchain.toml`.
      - name: Rust-versjon
        working-directory: kjerne
        run: rustc --version

      - name: Bygg pakken
        run: bun --filter @fristil/designsystem build

      - name: Les versjonen
        id: versjon
        working-directory: designsystem
        run: echo "nummer=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Taggen og versjonen i package.json må si det samme. En tagg v0.3.0 på
      # en commit som fortsatt sier 0.2.0 ville ellers publisert 0.2.0, eller
      # hoppet over den, og taggen i historikken ville pekt på noe annet enn
      # det som ligger på npm.
      - name: Se at taggen og versjonen stemmer
        if: github.ref_type == 'tag'
        run: |
          tagg="${GITHUB_REF_NAME#v}"
          if [ "$tagg" != "${{ steps.versjon.outputs.nummer }}" ]; then
            echo "Taggen $GITHUB_REF_NAME sier $tagg, mens package.json sier ${{ steps.versjon.outputs.nummer }}. Rett opp før du publiserer." >&2
            exit 1
          fi

      # Den første utgivelsen gjøres fra maskinen, siden npm bare lar deg
      # koble en utgiver til en pakke som allerede finnes. Taggen for den
      # versjonen ville ellers starte en kjøring som feilet på at versjonen
      # er tatt.
      - name: Se om versjonen alt er ute
        id: registeret
        run: |
          if npm view "@fristil/designsystem@${{ steps.versjon.outputs.nummer }}" version > /dev/null 2>&1; then
            echo "publisert=ja" >> "$GITHUB_OUTPUT"
          else
            echo "publisert=nei" >> "$GITHUB_OUTPUT"
          fi

      # `--ignore-scripts` fordi bygget alt er gjort i et eget steg. Uten det
      # kjører `prepublishOnly` hele bygget en gang til.
      - name: Publiser
        if: steps.registeret.outputs.publisert == 'nei'
        working-directory: designsystem
        run: npm publish --ignore-scripts

      - name: Versjonen var alt publisert
        if: steps.registeret.outputs.publisert == 'ja'
        run: echo "@fristil/designsystem@${{ steps.versjon.outputs.nummer }} ligger alt på npm. Ingenting ble publisert."

  # Kommandolinja uten Node: `fristil.wasm` for wasmtime og andre WASI-verter,
  # og `fristil.jar` for `java -jar`. Begge kommer fra npm-pakken for
  # versjonen, så de er de samme filene som `npx @fristil/designsystem` kjører.
  #
  # Ingen av filene er signert med et sertifikat, og ingen må stole på en
  # tredje part. GitHub attesterer i stedet hvilken commit og hvilken
  # arbeidsflyt hver fil ble bygd av, og den som laster ned, kan kontrollere
  # det selv:
  #
  #   gh attestation verify fristil.jar --repo MarkusAugust/fristil
  kommandolinje:
    name: Kommandolinja på GitHub Releases
    needs: publiser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Registeret kan bruke litt tid før en ny versjon svarer overalt.
      - name: Vent til versjonen svarer på npm
        run: |
          versjon="$(grep '^version=' kotlin/gradle.properties | cut -d= -f2)"
          for _ in $(seq 1 30); do
            npm view "@fristil/designsystem@$versjon" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@fristil/designsystem@$versjon svarte ikke på npm innen fem minutter." >&2
          exit 1

      # Uten `fristil.pakke` henter Gradle tarballen fra npm og sammenligner
      # den med integriteten registeret oppgir.
      - name: Kommandolinja som jar
        working-directory: kotlin
        run: ./gradlew :kommandolinje:samletJar

      - name: Samle filene
        run: |
          mkdir utgivelse
          cp kotlin/build/fristil-pakke/kjerne/fristil.wasm utgivelse/
          cp kotlin/kommandolinje/build/libs/fristil.jar utgivelse/
          (cd utgivelse && sha256sum fristil.wasm fristil.jar > SHA256SUMS)
          cat utgivelse/SHA256SUMS

      # Filene skal svare før de gis ut.
      - name: Filene virker
        run: |
          java -jar utgivelse/fristil.jar --hjelp > /dev/null
          echo '<button class="fs-button">Lagre</button>' | java -jar utgivelse/fristil.jar sjekk

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            utgivelse/fristil.wasm
            utgivelse/fristil.jar

      - uses: actions/upload-artifact@v4
        with:
          name: kommandolinja
          path: utgivelse/

      # Utgivelsen lages første gang, og filene byttes ut om den alt finnes,
      # så en ny kjøring for samme tagg ikke feiler.
      - name: Gi ut
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Se CHANGELOG.md i designsystem/."
          fi
          gh release upload "$GITHUB_REF_NAME" utgivelse/fristil.wasm utgivelse/fristil.jar utgivelse/SHA256SUMS --clobber

  # Kotlin-pakken, kotlinx.html-utvidelsen, kommandolinja og Gradle-pluginen,
  # alle som `io.github.markusaugust:…` med samme versjon som npm-pakken.
  #
  # Det krever en konto på central.sonatype.com med navnerommet
  # `io.github.markusaugust` bekreftet, et brukertoken derfra og en
  # GPG-nøkkel lastet opp til en nøkkeltjener. Hemmelighetene heter
  # `MAVEN_CENTRAL_USERNAME`, `MAVEN_CENTRAL_PASSWORD`, `MAVEN_SIGNING_KEY`
  # (den private nøkkelen, ASCII-armert) og `MAVEN_SIGNING_PASSWORD`. Mangler
  # de, sier jobben fra og publiserer ingenting.
  maven:
    name: Maven Central
    needs: publiser
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Les versjonen
        id: versjon
        run: echo "nummer=$(grep '^version=' kotlin/gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Vent til versjonen svarer på npm
        run: |
          for _ in $(seq 1 30); do
            npm view "@fristil/designsystem@${{ steps.versjon.outputs.nummer }}" version > /dev/null 2>&1 && exit 0
            sleep 10
          done
          echo "@fristil/designsystem@${{ steps.versjon.outputs.nummer }} svarte ikke på npm innen fem minutter." >&2
          exit 1

      # En versjon på Central kan aldri byttes ut, så en ny kjøring for samme
      # tagg skal ikke prøve igjen.
      # En hemmelighet som ikke finnes, kommer hit som en tom streng.
      - name: Se om versjonen alt er ute
        id: central
        env:
          BRUKER: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          PASSORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          NOKKEL: ${{ secrets.MAVEN_SIGNING_KEY }}
          NOKKELPASSORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          v="${{ steps.versjon.outputs.nummer }}"
          if curl -sfI "https://repo1.maven.org/maven2/io/github/markusaugust/fristil/$v/fristil-$v.pom" > /dev/null; then
            echo "io.github.markusaugust:fristil:$v ligger alt på Maven Central. Ingenting ble publisert."
            echo "publiser=nei" >> "$GITHUB_OUTPUT"
          elif [ -z "$BRUKER" ] || [ -z "$PASSORD" ] || [ -z "$NOKKEL" ] || [ -z "$NOKKELPASSORD" ]; then
            echo "::warning::En eller flere av hemmelighetene for Maven Central mangler, så Kotlin-pakken ble ikke publisert. Se kommentaren over jobben i publish.yml."
            echo "publiser=nei" >> "$GITHUB_OUTPUT"
          else
            echo "publiser=ja" >> "$GITHUB_OUTPUT"
          fi

      # Testene kjører mot den publiserte tarballen, så det som går ut er
      # testet mot nøyaktig de filene.
      - name: Test
        working-directory: kotlin
        run: ./gradlew test

      - name: Publiser
        if: steps.central.outputs.publiser == 'ja' && github.ref_type == 'tag'
        working-directory: kotlin
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral
