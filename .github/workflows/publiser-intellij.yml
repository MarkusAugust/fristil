name: Publiser IntelliJ-pluginen

# Kjører når en tagg på formen intellij-v* dyttes opp, og kan startes for
# hånd. Pluginen har sitt eget nummer i editor-intellij/gradle.properties,
# adskilt fra pakkens v*-tagger og utvidelsens utvidelse-v*-tagger.
#
# JetBrains godkjenner hver versjon før den blir synlig på Marketplace, så en
# kjøring her laster bare opp. Første versjon ble lastet opp for hånd, slik
# Marketplace krever.
on:
  push:
    tags: ["intellij-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publiser:
    name: Bygg, test og last opp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Pluginen bygger Rust-kjernen gjennom `../kotlin`. rustup finnes på
      # maskinen og henter versjonen i `kjerne/rust-toolchain.toml`.
      - name: Rust-versjon
        working-directory: kjerne
        run: rustc --version

      - name: Les versjonen
        id: versjon
        working-directory: editor-intellij
        run: |
          nummer=$(grep '^pluginVersion=' gradle.properties | cut -d= -f2)
          plattform=$(grep '^platformVersion=' gradle.properties | cut -d= -f2)
          if [ -z "$nummer" ] || [ -z "$plattform" ]; then
            echo "Fant ikke pluginVersion og platformVersion i gradle.properties" >&2
            exit 1
          fi
          echo "nummer=$nummer" >> "$GITHUB_OUTPUT"
          echo "plattform=$plattform" >> "$GITHUB_OUTPUT"

      - name: Se at taggen og versjonen stemmer
        if: github.ref_type == 'tag'
        run: |
          tagg="${GITHUB_REF_NAME#intellij-v}"
          if [ "$tagg" != "${{ steps.versjon.outputs.nummer }}" ]; then
            echo "Taggen $GITHUB_REF_NAME sier $tagg, mens gradle.properties sier ${{ steps.versjon.outputs.nummer }}. Rett opp før du publiserer." >&2
            exit 1
          fi

      - name: Hent IntelliJ-plattformen fra cache
        uses: actions/cache@v4
        with:
          path: editor-intellij/.intellijPlatform
          key: intellij-${{ steps.versjon.outputs.plattform }}

      - name: Bygg og test
        working-directory: editor-intellij
        run: ./gradlew build

      # Marketplace har ingen OIDC. Tokenet lages under profilen på
      # plugins.jetbrains.com (My Tokens) og legges inn som hemmeligheten
      # JETBRAINS_MARKETPLACE_TOKEN. Mangler det, stopper steget her framfor
      # med en feilmelding fra Gradle om en egenskap som ikke er satt.
      - name: Last opp til JetBrains Marketplace
        working-directory: editor-intellij
        env:
          ORG_GRADLE_PROJECT_intellijPlatformPublishingToken: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_intellijPlatformPublishingToken" ]; then
            echo "Hemmeligheten JETBRAINS_MARKETPLACE_TOKEN mangler." >&2
            exit 1
          fi
          ./gradlew publishPlugin
