[package]
name = "fristil-kjerne"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fristils sjekk og temagenerator, kompilert til WebAssembly for alle vertsspråk."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Temaet, `fristil-tema`, er en egen crate i `tema/`, under denne: pakken
# bygger fargematrisen sin med den før manifestet finnes, så kjernen bygges
# én gang. Kommandolinja, `fristil`, er en egen crate i `cli/`. Den bruker
# kjernen som et vanlig bibliotek, og bygges både for maskinen og som
# WASI-modul.
[workspace]
members = ["tema", "cli"]

# CSS-tokenizeren fra Servo, den Firefox bruker, som leser CSS etter CSS
# Syntax Level 3, bærer leseren av stilarkene. Manifestet leses av den lille
# JSON-leseren i `tema/src/json.rs`, og de regulære uttrykkene fra TypeScript
# er skrevet ut for hånd, så modulen slipper en regex-motor.
[dependencies]
fristil-tema = { path = "tema" }
cssparser = "0.38"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
